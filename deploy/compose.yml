services:
  friday:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4871
      APP_ORIGIN: https://${APP_DOMAIN:-localhost}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: friday
      DATABASE_NAME: friday
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AUTH_REQUIRED: "true"
      TRUST_PROXY: "1"
    expose:
      - "4871"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - friday-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4871/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: friday
      POSTGRES_DB: friday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - friday-postgres:/var/lib/postgresql/data
    networks:
      - friday-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday -d friday"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      friday:
        condition: service_healthy
    networks:
      - friday-internal

volumes:
  friday-postgres:
  caddy-data:
  caddy-config:

networks:
  friday-internal:
