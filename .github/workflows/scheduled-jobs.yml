name: Scheduled jobs

# Friday's host scales to zero, so in-process timers cannot be relied on. These
# calls wake it and run each sweep. Every sweep is idempotent, so a retry or a
# manual re-run never double-sends.
#
# FRIDAY_CRON_SECRET (32+ characters) has to exist in two places, with the same
# value: the Hexclave project secret, and this repository's Actions secret.
# Unset or shorter on Hexclave, the route answers 404. Unset on GitHub, the
# job stops before the call. A failure opens a GitHub issue. Set
# BACKUP_ALERT_WEBHOOK_URL as well for a Slack or Discord ping.

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST daily: T-7 trip briefings
    - cron: "0 4 * * *"    # 09:30 IST daily: designer quote-queue digest
    - cron: "30 3 * * 1"   # 09:00 IST Mondays: guide feedback digest
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        default: all
        options: [all, briefings, quote-digest, guide-feedback-digest]

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

env:
  FRIDAY_URL: https://fridaytravel.vercel.app

jobs:
  briefings:
    name: T-7 briefings
    if: github.event_name == 'schedule' && github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","briefings"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trigger briefing sweep
        env:
          FRIDAY_CRON_SECRET: ${{ secrets.FRIDAY_CRON_SECRET }}
        run: |
          set -euo pipefail
          node scripts/cron-call.mjs \
            --url "$FRIDAY_URL/api/cron/briefings" \
            --method POST \
            --secret-env FRIDAY_CRON_SECRET \
            --secret-name FRIDAY_CRON_SECRET \
            --expect json \
            --error-file cron-error.txt
      - name: Alert the owners
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          detail="$(cat cron-error.txt 2>/dev/null || true)"
          if [ -z "$detail" ]; then detail="The T-7 briefing job failed. See the run log."; fi
          node scripts/workflow-alert.mjs --title "Friday briefing job is failing" --detail "$detail"
      - name: Close the failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflow-alert.mjs --resolve --title "Friday briefing job is failing"

  quote-digest:
    name: Quote digest
    if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","quote-digest"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trigger quote digest
        env:
          FRIDAY_CRON_SECRET: ${{ secrets.FRIDAY_CRON_SECRET }}
        run: |
          set -euo pipefail
          node scripts/cron-call.mjs \
            --url "$FRIDAY_URL/api/cron/quote-digest" \
            --method POST \
            --secret-env FRIDAY_CRON_SECRET \
            --secret-name FRIDAY_CRON_SECRET \
            --expect json \
            --error-file cron-error.txt
      - name: Alert the owners
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          detail="$(cat cron-error.txt 2>/dev/null || true)"
          if [ -z "$detail" ]; then detail="The quote digest job failed. See the run log."; fi
          node scripts/workflow-alert.mjs --title "Friday quote digest job is failing" --detail "$detail"
      - name: Close the failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflow-alert.mjs --resolve --title "Friday quote digest job is failing"

  guide-feedback-digest:
    name: Guide feedback digest
    if: github.event_name == 'schedule' && github.event.schedule == '30 3 * * 1' || github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","guide-feedback-digest"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trigger guide feedback digest
        env:
          FRIDAY_CRON_SECRET: ${{ secrets.FRIDAY_CRON_SECRET }}
        run: |
          set -euo pipefail
          node scripts/cron-call.mjs \
            --url "$FRIDAY_URL/api/cron/guide-feedback-digest" \
            --method POST \
            --secret-env FRIDAY_CRON_SECRET \
            --secret-name FRIDAY_CRON_SECRET \
            --expect json \
            --error-file cron-error.txt
      - name: Alert the owners
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          detail="$(cat cron-error.txt 2>/dev/null || true)"
          if [ -z "$detail" ]; then detail="The guide feedback digest job failed. See the run log."; fi
          node scripts/workflow-alert.mjs --title "Friday guide feedback digest job is failing" --detail "$detail"
      - name: Close the failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflow-alert.mjs --resolve --title "Friday guide feedback digest job is failing"
