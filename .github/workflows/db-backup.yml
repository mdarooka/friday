name: Nightly database backup

on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: db-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download and encrypt dump
        env:
          FRIDAY_BACKUP_SECRET: ${{ secrets.FRIDAY_BACKUP_SECRET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            printf '%s\n' "BACKUP_PASSPHRASE is not set as a GitHub Actions secret, so the dump cannot be encrypted. Keep a copy of it offline; without it the backups cannot be read." > cron-error.txt
            echo "::error::BACKUP_PASSPHRASE must be set as a repository secret."
            exit 1
          fi
          node scripts/cron-call.mjs \
            --url https://fridaytravel.vercel.app/api/cron/db-backup \
            --method GET \
            --secret-env FRIDAY_BACKUP_SECRET \
            --secret-name FRIDAY_BACKUP_SECRET \
            --expect pgdump \
            --out friday.dump \
            --error-file cron-error.txt
          out="friday-$(date -u +%Y-%m-%d).dump.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE -in friday.dump -out "$out"
          rm -f friday.dump
          echo "Encrypted backup: $(wc -c < "$out") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: friday-db-backup
          path: friday-*.dump.enc
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Alert the owners
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          detail="$(cat cron-error.txt 2>/dev/null || true)"
          if [ -z "$detail" ]; then detail="The nightly database backup failed. See the run log."; fi
          node scripts/workflow-alert.mjs --title "Friday nightly database backup is failing" --detail "$detail"

      - name: Close the failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflow-alert.mjs --resolve --title "Friday nightly database backup is failing"
